group 'io.github.amrjlg'


ext {
    moduleProjects = subprojects.findAll { it.name.startsWith("common-") }
}

configure(moduleProjects) { p ->
    apply from: "$rootDir/gradle/common-module.gradle"

    test {
        useJUnitPlatform()
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter-api:5.6.0'
        testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    }


    repositories {
        mavenLocal()
        mavenCentral()
    }
}

buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
    }
    dependencies {
        classpath("io.spring.javaformat:spring-javaformat-gradle-plugin:0.0.35")
    }
}

apply plugin: 'io.spring.javaformat'